# Hermes Backend - Full config with MyBatis-Plus + H2 (demo) + JWT + Security + Hadoop
server:
  port: 8080

spring:
  application:
    name: hermes-backend
  datasource:
    url: jdbc:h2:mem:hermes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none   # MyBatis-Plus handles tables

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml   # if custom XML needed

# JWT config
jwt:
  secret: hermes-super-secret-key-for-jwt-token-generation-2026-change-in-prod
  expiration: 86400000   # 24 hours in ms

# Hadoop multi-cluster (extend with DB Cluster table later)
hadoop:
  default-cluster-id: cluster1
  clusters:
    cluster1:
      namenode: hdfs://your-namenode:8020   # CHANGE THIS
      resourcemanager: your-rm-host:8032
      version: 3.3.6
      auth: simple   # or kerberos
      # keytab: /path/to/keytab
      # principal: hdfs@REALM

logging:
  level:
    com.hermes: DEBUG
    org.apache.hadoop: WARN
    org.springframework.security: DEBUG