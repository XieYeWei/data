# =============================================
# Hermes Backend - MySQL 8 生产配置（推荐）
# =============================================
server:
  port: 8080

spring:
  application:
    name: hermes-backend

  # ==================== MySQL 8 配置 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/hermes?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_mysql_password_here          # ← 修改为你的 MySQL 密码
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # MyBatis-Plus 配置
  jpa:
    hibernate:
      ddl-auto: none                    # 生产环境建议使用 Flyway 或手动建表

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  secret: hermes-super-secret-key-for-jwt-token-generation-2026-change-in-prod
  expiration: 86400000

# Hadoop 多集群配置
hadoop:
  default-cluster-id: cluster1

# 通知配置（邮件 + 钉钉）
notification:
  dingtalk:
    webhook: ""                       # 填入你的钉钉机器人 Webhook

spring:
  mail:
    host: smtp.example.com
    port: 587
    username: your@email.com
    password: your_email_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 日志
logging:
  level:
    com.hermes: DEBUG
    org.apache.hadoop: WARN

# ==================== 开发环境 H2 配置（备用） ====================
