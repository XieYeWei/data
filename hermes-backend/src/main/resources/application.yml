# =============================================
# Hermes Backend - MySQL 8 配置
# =============================================
server:
  port: 8080

spring:
  application:
    name: hermes-backend

  datasource:
    url: jdbc:mysql://localhost:3306/hermes?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_mysql_password_here
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: hermes-super-secret-key-for-jwt-token-generation-2026-change-in-prod
  expiration: 86400000

# Hadoop
hadoop:
  default-cluster-id: cluster1

# 数据库迁移脚本目录（建议集成 Flyway 后使用）
# spring.flyway:
#   locations: classpath:db/migration
#   baseline-on-migrate: true

logging:
  level:
    com.hermes: DEBUG
    org.apache.hadoop: WARN